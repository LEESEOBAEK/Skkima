<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1320" viewBox="0 0 1200 1320" role="img" aria-labelledby="title desc">
  <title id="title">Skkima Public Code Scope</title>
  <desc id="desc">A readable map of the public Skkima code grouped into three conceptual layers: desktop surface, workflow engine, and contracts and verification. The layers are a grouping, not an execution sequence.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <style>
      .title { font: 600 38px 'Segoe UI', Arial, sans-serif; fill: #f5f6fb; letter-spacing: -0.3px; }
      .subtitle { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #a7adbf; }
      .badge { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #151822; letter-spacing: 0.8px; }
      .layer-title { font: 600 24px 'Segoe UI', Arial, sans-serif; fill: #f5f6fb; }
      .layer-note { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #a7adbf; }
      .card-title { font: 600 19px 'Segoe UI', Arial, sans-serif; fill: #f5f6fb; }
      .path { font: 500 17px 'Cascadia Mono', 'Consolas', monospace; fill: #d8ccff; text-decoration: none; }
      .note { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #aeb4c5; }
      .footer { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #9299ad; }
      .micro { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #b6a8ff; letter-spacing: 1.2px; }
    </style>
  </defs>

  <rect width="1200" height="1320" fill="none"/>
  <rect x="40" y="40" width="1120" height="1240" rx="28" fill="#171b27" fill-opacity="0.98" stroke="#2b3142" stroke-width="2" filter="url(#shadow)"/>

  <text x="90" y="112" class="title">Skkima Public Code Scope</text>
  <text x="90" y="147" class="subtitle">A readable map of the files included in this public preview.</text>
  <rect x="886" y="91" width="218" height="38" rx="19" fill="#d9d0ff"/>
  <text x="995" y="116" class="badge" text-anchor="middle">PUBLIC PREVIEW</text>
  <line x1="90" y1="190" x2="1110" y2="190" stroke="#2b3142" stroke-width="2"/>
  <text x="90" y="220" class="micro">CONCEPTUAL LAYERS · NOT AN EXECUTION SEQUENCE</text>

  <!-- Layer 1 -->
  <rect x="90" y="245" width="1020" height="265" rx="20" fill="#1b1f2d" stroke="#3d3567" stroke-width="2"/>
  <rect x="90" y="245" width="1020" height="7" rx="3.5" fill="#8a73ef"/>
  <text x="122" y="292" class="layer-title">Desktop Surface</text>
  <text x="122" y="320" class="layer-note">Product shell and user-facing entry points.</text>

  <rect x="122" y="350" width="474" height="128" rx="14" fill="#23283a" stroke="#3b4160" stroke-width="1.5"/>
  <text x="148" y="386" class="card-title">UI prototype</text>
  <a href="https://github.com/LEESEOBAEK/Skkima/tree/portfolio/source-preview/apps/browser-workspace-prototype/src/" target="_blank">
    <text x="148" y="418" class="path">apps/browser-workspace-</text>
    <text x="148" y="441" class="path">prototype/src/</text>
    <title>Open UI prototype source</title>
  </a>
  <text x="148" y="465" class="note">Screens, state, and user flows</text>

  <rect x="624" y="350" width="454" height="128" rx="14" fill="#23283a" stroke="#3b4160" stroke-width="1.5"/>
  <text x="650" y="386" class="card-title">Tauri adapter</text>
  <a href="https://github.com/LEESEOBAEK/Skkima/tree/portfolio/source-preview/apps/browser-workspace-prototype/src-tauri/src/" target="_blank">
    <text x="650" y="418" class="path">apps/browser-workspace-</text>
    <text x="650" y="441" class="path">prototype/src-tauri/src/</text>
    <title>Open Tauri adapter source</title>
  </a>
  <text x="650" y="465" class="note">Windows shell and local boundary</text>

  <!-- Layer 2 -->
  <rect x="90" y="540" width="1020" height="265" rx="20" fill="#1b1f2d" stroke="#3d3567" stroke-width="2"/>
  <rect x="90" y="540" width="1020" height="7" rx="3.5" fill="#8a73ef"/>
  <text x="122" y="587" class="layer-title">Workflow Engine</text>
  <text x="122" y="615" class="layer-note">Request routing, execution, and recovery logic.</text>

  <rect x="122" y="645" width="474" height="148" rx="14" fill="#23283a" stroke="#3b4160" stroke-width="1.5"/>
  <text x="148" y="681" class="card-title">Python workflow</text>
  <a href="https://github.com/LEESEOBAEK/Skkima/tree/portfolio/source-preview/engine/python/workflow/" target="_blank">
    <text x="148" y="718" class="path">engine/python/workflow/</text>
    <title>Open Python workflow source</title>
  </a>
  <a href="https://github.com/LEESEOBAEK/Skkima/tree/portfolio/source-preview/engine/python/layers/" target="_blank">
    <text x="148" y="742" class="path">engine/python/layers/</text>
    <title>Open workflow layers source</title>
  </a>
  <text x="148" y="780" class="note">Routing, execution, and validation</text>

  <rect x="624" y="645" width="454" height="148" rx="14" fill="#23283a" stroke="#3b4160" stroke-width="1.5"/>
  <text x="650" y="681" class="card-title">Governance modules</text>
  <a href="https://github.com/LEESEOBAEK/Skkima/tree/portfolio/source-preview/engine/python/shared/" target="_blank">
    <text x="650" y="718" class="path">engine/python/shared/</text>
    <title>Open governance modules</title>
  </a>
  <text x="650" y="780" class="note">Approval, state, and error rules</text>

  <!-- Layer 3 -->
  <rect x="90" y="835" width="1020" height="265" rx="20" fill="#1b1f2d" stroke="#3d3567" stroke-width="2"/>
  <rect x="90" y="835" width="1020" height="7" rx="3.5" fill="#8a73ef"/>
  <text x="122" y="882" class="layer-title">Contracts &amp; Verification</text>
  <text x="122" y="910" class="layer-note">Contracts, fixtures, and regression checks.</text>

  <rect x="122" y="940" width="474" height="128" rx="14" fill="#23283a" stroke="#3b4160" stroke-width="1.5"/>
  <text x="148" y="976" class="card-title">Contracts &amp; fixtures</text>
  <a href="https://github.com/LEESEOBAEK/Skkima/tree/portfolio/source-preview/contracts/" target="_blank">
    <text x="148" y="1008" class="path">contracts/</text>
    <title>Open contracts source</title>
  </a>
  <a href="https://github.com/LEESEOBAEK/Skkima/tree/portfolio/source-preview/fixtures/" target="_blank">
    <text x="148" y="1031" class="path">fixtures/</text>
    <title>Open fixtures source</title>
  </a>
  <text x="148" y="1055" class="note">Input contracts and reproducible cases</text>

  <rect x="624" y="940" width="454" height="128" rx="14" fill="#23283a" stroke="#3b4160" stroke-width="1.5"/>
  <text x="650" y="976" class="card-title">Tests</text>
  <a href="https://github.com/LEESEOBAEK/Skkima/tree/portfolio/source-preview/tests/" target="_blank">
    <text x="650" y="1008" class="path">tests/</text>
    <title>Open engine tests</title>
  </a>
  <a href="https://github.com/LEESEOBAEK/Skkima/tree/portfolio/source-preview/apps/browser-workspace-prototype/tests/" target="_blank">
    <text x="650" y="1031" class="path">apps/browser-workspace-</text>
    <text x="650" y="1054" class="path">prototype/tests/</text>
    <title>Open UI tests</title>
  </a>

  <line x1="90" y1="1150" x2="1110" y2="1150" stroke="#2b3142" stroke-width="2"/>
  <text x="90" y="1190" class="footer">Public preview: executable code, contracts, and tests. Personal runs, credentials, and internal outputs stay private.</text>
</svg>
